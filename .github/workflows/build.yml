name: Build BTChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Auto version
        id: ver
        run: |
          VC=${{ github.run_number }}
          VN="2.0.$VC"
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "tag=v$VC" >> $GITHUB_OUTPUT
          sed -i "s/versionCode = [0-9]*/versionCode = $VC/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VN\"/" app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-tmp
          mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
          rm -rf cmdline-tools-tmp cmdline-tools.zip
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: |
          echo "## ERRORS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "e: file:///" build.log | head -20 >> $GITHUB_STEP_SUMMARY
          grep -B1 -A5 "What went wrong" build.log | head -30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if error
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/btchat-${{ steps.ver.outputs.version_name }}.apk

      - name: Auto Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: BTChat ${{ steps.ver.outputs.version_name }}
          body: "Auto-release #${{ github.run_number }}"
          files: output/*.apk
