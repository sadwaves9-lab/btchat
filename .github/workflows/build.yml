name: Build BTChat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto version
        id: ver
        run: |
          VC=${{ github.run_number }}
          VN="2.0.$VC"
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "tag=v$VC" >> $GITHUB_OUTPUT
          sed -i "s/versionCode = [0-9]*/versionCode = $VC/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VN\"/" app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-tmp
          mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
          rm -rf cmdline-tools-tmp cmdline-tools.zip
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          chmod +x gradlew
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/btchat-${{ steps.ver.outputs.version_name }}.apk
          ls -la output/

      - name: Create GitHub Release (for OTA)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: BTChat ${{ steps.ver.outputs.version_name }}
          body: |
            🚀 BTChat Auto Release
            
            **Version:** ${{ steps.ver.outputs.version_name }}
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
          files: output/*.apk
          draft: false
          prerelease: false

      - name: Upload Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: BTChat-APK
          path: app/build/outputs/apk/debug/*.apk
